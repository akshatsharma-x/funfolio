# Publishes the static export to GitHub Pages — only when you run it (Actions → "Deploy to GitHub Pages" → Run
# workflow), after Settings → Pages → Source: "GitHub Actions". No secrets, no environment variables.
# The site uses root paths (/_next/…, /cursors/…), so serve it from a domain's root: the <user>.github.io repository,
# or any repository with a custom domain (put the domain in public/CNAME). GitHub Pages can't set response headers,
# so public/_headers (the CSP and caching) applies only on Netlify / Cloudflare Pages / Vercel.
name: Deploy to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
