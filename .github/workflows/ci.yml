# Checks every push and pull request: lint + types, the static build (with its R1 / R10 / budget checks) and the
# Playwright suites against the export (the smoke test plus every world, game and control, played like a visitor).
# Deploys nothing.
name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
